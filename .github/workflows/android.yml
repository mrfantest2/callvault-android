name: Android CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testPlayDebugUnitTest

      - name: Build Play debug
        run: ./gradlew assemblePlayDebug --stacktrace

      - name: Build Full debug
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Lint Play
        run: ./gradlew lintPlayDebug

      - name: Lint Full
        run: ./gradlew lintFullDebug
